services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opshub
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub-local
    ports:
      - "5432:5432"
    volumes:
      - opshub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshub -d opshub"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  opshub-postgres: